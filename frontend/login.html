<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - HealthPass</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/logins.css">
    <link rel="stylesheet" href="css/refine.css">
</head>
<body>

    <div class="auth-card">
        <!-- Volver al inicio dentro de la tarjeta -->
        <a href="index.html" class="back-link">
    <span class="back-arrow">←</span>
    <span>Volver al inicio</span>
</a>

        <!-- Brand / Logo -->
        <div class="brand-logo">
            <div class="brand-icon">
                <img src="images/corazon.png" alt="HealthPass Icon">
            </div>
            <span class="brand-name">HealthPass</span>
        </div>

        <!-- Títulos -->
        <h1 class="auth-title">Bienvenido de vuelta</h1>
        <p class="auth-subtitle">Ingresa a tu cuenta para continuar.</p>

        <!-- Formulario -->
        <form class="auth-form" id="authForm" data-mode="login">
            <div class="form-group">
                <label for="username">Usuario o correo <span class="required-star">*</span></label>
                <input type="text" id="username" placeholder="tu_usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña <span class="required-star">*</span></label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <p class="form-error" id="formError" role="alert" hidden></p>

            <div class="forgot-link-container">
                <a href="#" class="forgot-link">Olvidé mi contraseña</a>
            </div>

            <button type="submit" class="btn-submit">Iniciar sesión</button>
        </form>

        <!-- Footer -->
        <div class="auth-footer">
            <p>¿No tienes cuenta? <a href="register.html">Crear cuenta gratis</a></p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
