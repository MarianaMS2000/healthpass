<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos de Emergencia - HealthPass</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/contacts.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL (TEAL) -->
    <header class="contacts-header">
        <div class="header-inner">
            <div class="header-title-box">
                <h1>Contactos de emergencia</h1>
                <p id="contactsCount">Cargando…</p>
            </div>
            <button type="button" class="btn-add-contact" id="btnAddContact">
                <i class="bi bi-plus-lg"></i> Agregar
            </button>
        </div>
    </header>

    <!-- CONTENEDOR CENTRAL DE TARJETAS DE CONTACTO -->
    <main class="contacts-container" id="contactsList"></main>

    <!-- BARRA INFERIOR DE NAVEGACIÓN -->
    <nav class="bottom-nav">
        <div class="nav-inner">
            <a href="dashboard.html" class="nav-item">
                <i class="bi bi-house-door"></i>
                <span>Inicio</span>
            </a>
            <a href="info.html" class="nav-item">
                <i class="bi bi-info-circle"></i>
                <span>Mi información</span>
            </a>
            <a href="contacts.html" class="nav-item active">
                <i class="bi bi-telephone"></i>
                <span>Contactos</span>
            </a>
            <a href="profile.html" class="nav-item">
                <i class="bi bi-person"></i>
                <span>Perfil</span>
            </a>
        </div>
    </nav>

    <!-- MODAL NUEVO CONTACTO DE EMERGENCIA -->
    <div class="modal-overlay" id="addContactModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Nuevo contacto de emergencia</h2>
                <button type="button" class="modal-close-btn" id="closeAddContactModal">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form class="modal-body" id="form-addContactModal">
                <div class="form-group">
                    <label for="contactName">Nombre completo <span class="required">*</span></label>
                    <input type="text" id="contactName" class="form-control" placeholder="María González">
                </div>
                <div class="form-group">
                    <label for="contactRelation">Relación <span class="required">*</span></label>
                    <input type="text" id="contactRelation" class="form-control" placeholder="Esposa, madre, hermano...">
                </div>
                <div class="form-group">
                    <label for="contactPhone">Teléfono <span class="required">*</span></label>
                    <input type="text" id="contactPhone" class="form-control" placeholder="+57 300 123 4567">
                </div>
                <div class="form-group">
                    <label class="check-row" for="contactPrincipal">
                        <input type="checkbox" id="contactPrincipal">
                        <span>Marcar como contacto principal</span>
                    </label>
                    <p class="field-hint">Solo puede haber uno. Si lo marcas, el anterior deja de ser el principal.</p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="cancelAddContactModal">Cancelar</button>
                    <button type="submit" class="btn-modal-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL EDITAR CONTACTO DE EMERGENCIA -->
    <div class="modal-overlay" id="editContactModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Editar contacto</h2>
                <button type="button" class="modal-close-btn" id="closeEditContactModal">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <form class="modal-body" id="form-editContactModal">
                <div class="form-group">
                    <label for="editContactName">Nombre completo <span class="required">*</span></label>
                    <input type="text" id="editContactName" class="form-control" value="María González">
                </div>
                <div class="form-group">
                    <label for="editContactRelation">Relación <span class="required">*</span></label>
                    <input type="text" id="editContactRelation" class="form-control" value="Esposa">
                </div>
                <div class="form-group">
                    <label for="editContactPhone">Teléfono <span class="required">*</span></label>
                    <input type="text" id="editContactPhone" class="form-control" value="+57 300 123 4567">
                </div>
                <div class="form-group">
                    <label class="check-row" for="editContactPrincipal">
                        <input type="checkbox" id="editContactPrincipal">
                        <span>Contacto principal</span>
                    </label>
                    <p class="field-hint">Solo puede haber uno. Si lo marcas, el anterior deja de ser el principal.</p>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-modal-cancel" id="cancelEditContactModal">Cancelar</button>
                    <button type="submit" class="btn-modal-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE INTERACTIVIDAD (AL FINAL) -->
    <script src="js/api.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
